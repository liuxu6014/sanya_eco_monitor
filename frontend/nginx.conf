# 前端挂在子路径 /sanya 下 + /api 同源反代到后端（同源后无需 CORS、cookie 工作更稳）。
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 20m;

    # 根路径与裸 /sanya 跳转到 /sanya/
    location = / { return 301 /sanya/; }
    location = /sanya { return 301 /sanya/; }

    # API 反代到后端服务（docker 网络内按服务名访问）
    location /api/ {
        proxy_pass http://backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 报告/AI 生成耗时较长
    }

    # 子路径下托管 SPA（构建产物 base=/sanya/），单页路由回退到 /sanya/index.html
    location /sanya/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /sanya/index.html;
    }
}

