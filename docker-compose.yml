services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanya-eco-backend
    # 仅在 docker 网络内暴露，由前端 nginx 反代 /api 访问，不直接对外。
    expose:
      - "8888"
    # 如需本机直连后端调试，临时打开下面两行：
    # ports:
    #   - "8888:8888"
    volumes:
      - ./deploy/runtime/backend:/app/runtime
      - ./backend/data:/app/data
      - ./logs/backend:/app/logs
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/runtime/sanya_eco.db
      LOG_DIR: /app/logs
      TZ: Asia/Shanghai
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanya-eco-frontend
    ports:
      - "5188:80"
      # 启用 HTTPS 后取消注释（并在 frontend/nginx.conf 配置证书）：
      # - "443:443"
    # volumes:
    #   # HTTPS 证书目录，需含 fullchain.pem / privkey.pem
    #   - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/sanya/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: sanya-eco-network
