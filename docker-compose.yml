services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanya-eco-backend
    ports:
      - "8888:8888"
    volumes:
      - ./deploy/runtime/backend:/app/runtime
      - ./backend/data:/app/data
      - ./logs/backend:/app/logs
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/runtime/sanya_eco.db
      LOG_DIR: /app/logs
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: node:20
    container_name: sanya-eco-frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: http://backend:8888
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi && npx vite --host 0.0.0.0 --port 5188"
    ports:
      - "5188:5188"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5188').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: sanya-eco-network

volumes:
  frontend_node_modules:
